<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的收藏馆">
  <title>我的收藏馆</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css?v=20260927">
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnBack" style="visibility:hidden" aria-label="返回">←</button>
    <h1 class="topbar-title" id="topbarTitle">我的收藏馆</h1>
    <button class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
  </header>

  <!-- 主视图容器 -->
  <main id="view" class="view"></main>

  <!-- 底部导航栏 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab-item" id="tabHome" data-tab="home"><span class="tab-icon">🏠</span><span class="tab-label">首页</span></button>
    <button class="tab-item" id="tabCat" data-tab="cat"><span class="tab-icon">🗂</span><span class="tab-label">分类</span></button>
    <button class="tab-item" id="tabFav" data-tab="fav"><span class="tab-icon">❤️</span><span class="tab-label">喜欢</span></button>
    <button class="tab-item" id="tabAdd" data-tab="add"><span class="tab-fab">＋</span></button>
    <button class="tab-item" id="tabQuest" data-tab="quest"><span class="tab-icon">🎯</span><span class="tab-label">任务</span></button>
    <button class="tab-item" id="tabStats" data-tab="stats"><span class="tab-icon">🏆</span><span class="tab-label">成就</span></button>
    <button class="tab-item" id="tabSettings" data-tab="settings"><span class="tab-icon">⚙</span><span class="tab-label">设置</span></button>
  </nav>

  <!-- 全局弹层 -->
  <div class="modal-mask" id="modalMask" hidden></div>
  <div class="modal" id="modal" hidden></div>

  <!-- 图片查看器 -->
  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" id="viewerClose">✕</button>
    <img id="viewerImg" alt="大图">
    <div class="viewer-nav" id="viewerNav"></div>
  </div>

  <!-- AI 小助手：浮动按钮 + 对话面板 -->
  <button class="ai-fab" id="aiFab" aria-label="打开 AI 喵助手">
    <img src="cat.png" alt="猫猫小助手" class="ai-fab-img">
    <span class="ai-fab-label">AI喵助手</span>
  </button>
  <div class="ai-panel" id="aiPanel" hidden>
    <div class="ai-head">
      <div class="ai-title"><span class="ai-head-cat"><img src="cat.png" alt="猫猫"></span> 收藏喵 AI 小助手 <small>DeepSeek</small></div>
      <button class="ai-close" id="aiClose">✕</button>
    </div>
    <div class="ai-body" id="aiBody">
      <div class="ai-chat" id="aiChat"></div>
    </div>
    <div class="ai-quick" id="aiQuick">
      <button class="ai-q" data-q="总结我最近的收藏情况">📊 总结收藏</button>
      <button class="ai-q" data-q="看看我这个月盘了哪些串">🤲 本月盘串</button>
      <button class="ai-q" data-q="我这个月买了什么">🛒 本月买串</button>
    </div>
    <div class="ai-inputbar">
      <textarea id="aiInput" rows="1" placeholder="问问你的收藏馆，比如：帮我总结9月的盘串记录"></textarea>
      <button class="ai-send" id="aiSend">发送</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/image.js"></script>
  <script src="js/color.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
