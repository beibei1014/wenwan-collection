<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的收藏馆">
  <title>我的收藏馆</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css?v=20261130">
  <!-- v113：文玩手账皮肤（在 style.css 之后加载，只加外观不动原样式） -->
  <link rel="stylesheet" href="css/skin.css?v=20261128">
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnBack" style="visibility:hidden" aria-label="返回">←</button>
    <h1 class="topbar-title" id="topbarTitle">我的收藏馆</h1>
    <button class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
  </header>

  <!-- 主视图容器 -->
  <main id="view" class="view"></main>

  <!-- 底部导航栏（v113：emoji 换成线性 SVG 图标，跨设备显示一致、更耐看） -->
  <nav class="tabbar" id="tabbar">
    <button class="tab-item" id="tabHome" data-tab="home"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 10.6 12 3.4l8.8 7.2"/><path d="M5.4 9.6V20.6h13.2V9.6"/><path d="M9.7 20.6v-5.6h4.6v5.6"/></svg></span><span class="tab-label">首页</span></button>
    <!-- v94：原「分类」这一格换成「沁灵」（用户要求：分类换成沁灵）。分类 tab 元素保留但隐藏，随时可恢复 -->
    <button class="tab-item" id="tabSpirit" data-tab="spirit"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l1.9 5.1 5.1 1.9-5.1 1.9L12 17.2l-1.9-5.1L5 10.2l5.1-1.9z"/><path d="M18.4 16.2l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg></span><span class="tab-label">沁灵</span></button>
    <!-- v161：导航栏重排 —— 「任务」换成「夜话」，顺序：首页 / 沁灵 / 夜话 / ＋ / 喜欢 / 成就 / 设置 -->
    <button class="tab-item" id="tabNight" data-tab="night"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 5.4h15.2a1.7 1.7 0 0 1 1.7 1.7v6a1.7 1.7 0 0 1-1.7 1.7h-8.6L7.2 18.4v-3.6H4.4a1.7 1.7 0 0 1-1.7-1.7v-6a1.7 1.7 0 0 1 1.7-1.7z"/><circle cx="8.3" cy="10.1" r="0.95" fill="currentColor" stroke="none"/><circle cx="12" cy="10.1" r="0.95" fill="currentColor" stroke="none"/><circle cx="15.7" cy="10.1" r="0.95" fill="currentColor" stroke="none"/></svg></span><span class="tab-label">夜话</span></button>
    <button class="tab-item" id="tabAdd" data-tab="add"><span class="tab-fab">＋</span></button>
    <button class="tab-item" id="tabFav" data-tab="fav"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2s-7.3-4.7-7.3-9.7A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.3 3.2c0 5-7.3 9.7-7.3 9.7z"/></svg></span><span class="tab-label">喜欢</span></button>
    <button class="tab-item" id="tabStats" data-tab="stats"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.4 4h9.2v4.6a4.6 4.6 0 0 1-9.2 0z"/><path d="M7.4 5.4H4.8v1.8a3.4 3.4 0 0 0 3.4 3.4"/><path d="M16.6 5.4h2.6v1.8a3.4 3.4 0 0 1-3.4 3.4"/><path d="M12 13.2v4.2"/><path d="M8.6 20.2h6.8"/></svg></span><span class="tab-label">成就</span></button>
    <button class="tab-item" id="tabSettings" data-tab="settings"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.4v2.3M12 18.3v2.3M4.7 7.8l2 1.2M17.3 15l2 1.2M4.7 16.2l2-1.2M17.3 9l2-1.2"/></svg></span><span class="tab-label">设置</span></button>
    <!-- v161：没进导航栏的两个 tab（分类 / 任务）保留 DOM 但隐藏，页面路由仍在，随时可恢复 -->
    <button class="tab-item" id="tabCat" data-tab="cat" style="display:none"><span class="tab-icon">🗂</span><span class="tab-label">分类</span></button>
    <button class="tab-item" id="tabQuest" data-tab="quest" style="display:none"><span class="tab-icon">📋</span><span class="tab-label">任务</span></button>
  </nav>

  <!-- 全局弹层 -->
  <div class="modal-mask" id="modalMask" hidden></div>
  <div class="modal" id="modal" hidden></div>

  <!-- 图片查看器 -->
  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" id="viewerClose">✕</button>
    <img id="viewerImg" alt="大图">
    <div class="viewer-nav" id="viewerNav"></div>
  </div>

  <!-- AI 小助手：浮动按钮 + 对话面板 -->
  <button class="ai-fab" id="aiFab" aria-label="打开 AI 喵助手">
    <img src="cat.png" alt="猫猫小助手" class="ai-fab-img">
    <span class="ai-fab-label">AI喵助手</span>
  </button>
  <div class="ai-panel" id="aiPanel" hidden>
    <div class="ai-head">
      <div class="ai-title"><span class="ai-head-cat"><img src="cat.png" alt="猫猫"></span> 收藏喵 AI 小助手 <small>DeepSeek</small></div>
      <div class="ai-head-actions">
        <button class="ai-clear" id="aiClear" title="清空对话">🧹</button>
        <button class="ai-close" id="aiClose">✕</button>
      </div>
    </div>
    <div class="ai-body" id="aiBody">
      <div class="ai-chat" id="aiChat"></div>
    </div>
    <div class="ai-quick" id="aiQuick">
      <button class="ai-q" data-q="总结我最近的收藏情况">📊 总结收藏</button>
      <button class="ai-q" data-q="看看我这个月盘了哪些串">🤲 本月盘串</button>
      <button class="ai-q" data-q="我这个月买了什么">🛒 本月买串</button>
      <button class="ai-q" data-q="哪些串该盘了？帮我按放置时间排个优先级">⏱ 哪些该盘</button>
      <button class="ai-q" data-q="我这个月一共花了多少钱？">💰 本月花费</button>
    </div>
    <div class="ai-inputbar">
      <textarea id="aiInput" rows="1" placeholder="问问你的收藏馆，比如：帮我总结9月的盘串记录"></textarea>
      <button class="ai-send" id="aiSend">发送</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20261128"></script>
  <script src="js/image.js?v=20261128"></script>
  <script src="js/color.js?v=20261128"></script>
  <script src="js/db.js?v=20261128"></script>
  <script src="js/ocr.js?v=20261128"></script>
  <script src="js/poster.js?v=20261128"></script>
  <script src="js/tips.js?v=20261128"></script>
  <script src="js/spirits.js?v=20261130"></script>
  <script src="js/rooms.js?v=20261128"></script>
  <script src="js/categories.js?v=20261128"></script>
  <script src="js/stats.js?v=20261128"></script>
  <script src="js/game.js?v=20261128"></script>
  <script src="js/app.js?v=20261130"></script>
</body>
</html>
