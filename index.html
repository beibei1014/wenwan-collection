<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="文玩手串馆">
  <title>文玩手串收藏馆</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnBack" style="visibility:hidden" aria-label="返回">←</button>
    <h1 class="topbar-title" id="topbarTitle">文玩手串收藏馆</h1>
    <button class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
  </header>

  <!-- 主视图容器 -->
  <main id="view" class="view"></main>

  <!-- 底部操作栏 -->
  <footer class="bottombar" id="bottombar">
    <button class="fab" id="btnAdd" aria-label="添加手串">＋</button>
  </footer>

  <!-- 全局弹层 -->
  <div class="modal-mask" id="modalMask" hidden></div>
  <div class="modal" id="modal" hidden></div>

  <!-- 图片查看器 -->
  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" id="viewerClose">✕</button>
    <img id="viewerImg" alt="大图">
    <div class="viewer-nav" id="viewerNav"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
