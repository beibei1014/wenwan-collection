<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d2b1f"/>
      <stop offset="1" stop-color="#5a3d2a"/>
    </linearGradient>
    <radialGradient id="bead" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#e8b96a"/>
      <stop offset="1" stop-color="#a06b2c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 念珠圆环 -->
  <g transform="translate(256,256)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#c9a15a" stroke-width="10" opacity="0.35"/>
    <!-- 14 颗珠子 -->
    <g fill="url(#bead)" stroke="#7a4f1e" stroke-width="2">
      <circle cx="0" cy="-150" r="30"/>
      <circle cx="78" cy="-128" r="30"/>
      <circle cx="142" cy="-46" r="30"/>
      <circle cx="142" cy="46" r="30"/>
      <circle cx="78" cy="128" r="30"/>
      <circle cx="0" cy="150" r="30"/>
      <circle cx="-78" cy="128" r="30"/>
      <circle cx="-142" cy="46" r="30"/>
      <circle cx="-142" cy="-46" r="30"/>
      <circle cx="-78" cy="-128" r="30"/>
    </g>
    <!-- 佛头大珠 -->
    <circle cx="0" cy="0" r="44" fill="url(#bead)" stroke="#7a4f1e" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="#3d2b1f" opacity="0.25"/>
  </g>
